[project]
name = "biahflow-api"
version = "0.1.0"
description = "API do portal Biahflow"
requires-python = ">=3.12"
dependencies = [
  "Django>=5.1,<5.3",
  "django-cors-headers>=4.9.0",
  # O `Document.file` no Cloud Storage quando `GCS_MEDIA_BUCKET` está preenchida.
  # Sempre instalado, inerte sem a variável — como o `sentry-sdk` abaixo.
  "django-storages[google]>=1.14,<2",
  "djangorestframework>=3.15,<3.17",
  "drf-spectacular>=0.28,<0.29",
  "google-api-python-client>=2.198.0",
  "google-auth>=2.56.2",
  "gunicorn>=23,<24",
  "openai>=2.52.1",
  "pgvector>=0.3",
  "psycopg[binary]>=3.2,<3.3",
  # Conta as páginas do PDF que vai para o fornecedor de assinatura (ADR 0065). A Autentique
  # posiciona a assinatura por **número de página** (`z`) e não aceita "última página": sem contar,
  # não há como pedir a última. Biblioteca pura, BSD-3-Clause, sem dependência de runtime no 3.12.
  "pypdf>=6,<7",
  "redis>=5.2,<7",
  # Rastreamento de erro (ADR 0012). Sempre instalado, inerte sem SENTRY_DSN.
  "sentry-sdk>=2,<3",
  "whitenoise>=6.8,<7",
]

[dependency-groups]
dev = [
  "pytest>=9.0.3,<10",
  "pytest-django>=4.9,<5",
  "pytest-cov>=6,<7",
  "factory-boy>=3.3,<4",
  "ruff>=0.9,<1",
  "mypy>=1.14,<2",
  "django-stubs>=5.1,<6",
  "pip-audit>=2.8,<3",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
addopts = "--strict-markers --cov=apps.core --cov-config=.coveragerc --cov-report=term-missing --cov-fail-under=90"
# `--strict-markers` obriga a declarar. `pgvector` marca o que só roda contra um Postgres com a
# extensão: na suíte padrão (SQLite) eles pulam, e o job `backend-pgvector` do CI roda só eles.
markers = ["pgvector: exige Postgres com a extensão vector; pula no SQLite da suíte padrão"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]

[tool.mypy]
plugins = ["mypy_django_plugin.main"]
exclude = "(^apps/core/tests/|^tests/)"
ignore_missing_imports = true
check_untyped_defs = true

[[tool.mypy.overrides]]
module = ["*.migrations.*"]
ignore_errors = true

[tool.django-stubs]
django_settings_module = "config.settings"
