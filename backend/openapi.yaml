components:
  schemas:
    AcceptInvitation:
      type: object
      properties:
        token:
          type: string
          format: uuid
        username:
          type: string
          maxLength: 150
        password:
          type: string
          writeOnly: true
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
      required:
      - password
      - token
      - username
    Activity:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        client:
          type: integer
        opportunity:
          type: integer
          nullable: true
        invoice:
          type: integer
          nullable: true
        kind:
          $ref: '#/components/schemas/ActivityKindEnum'
        kind_display:
          type: string
          readOnly: true
        happened_on:
          type: string
          format: date
        summary:
          type: string
          maxLength: 255
        notes:
          type: string
        cobranca_sinal:
          allOf:
          - $ref: '#/components/schemas/CobrancaSinalEnum'
          readOnly: true
        cobranca_sinal_display:
          type: string
          readOnly: true
        owner:
          type: integer
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - client
      - cobranca_sinal
      - cobranca_sinal_display
      - created_at
      - happened_on
      - id
      - kind
      - kind_display
      - owner
      - summary
      - updated_at
    ActivityKindEnum:
      enum:
      - call
      - meeting
      - email
      - note
      type: string
      description: |-
        * `call` - Ligação
        * `meeting` - Reunião
        * `email` - E-mail
        * `note` - Nota
    AgentRequest:
      type: object
      properties:
        question:
          type: string
      required:
      - question
    AgentResponse:
      type: object
      properties:
        text:
          type: string
        interaction:
          type: integer
      required:
      - interaction
      - text
    AiFeedback:
      type: object
      properties:
        interaction:
          type: integer
        rating:
          type: integer
      required:
      - interaction
      - rating
    AiMetrics:
      type: object
      properties:
        total:
          type: integer
        positive_rate:
          type: number
          format: double
          nullable: true
        by_feature:
          type: array
          items: {}
      required:
      - by_feature
      - positive_rate
      - total
    AnalyticsResponse:
      type: object
      properties:
        funnel:
          type: object
          additionalProperties: {}
        win_rate:
          type: number
          format: double
          nullable: true
        avg_ticket:
          type: number
          format: double
        avg_cycle_days:
          type: number
          format: double
          nullable: true
        pipeline:
          type: array
          items: {}
        roi:
          type: object
          additionalProperties: {}
      required:
      - avg_cycle_days
      - avg_ticket
      - funnel
      - pipeline
      - roi
      - win_rate
    ApplyGate:
      type: object
      properties:
        outcome:
          $ref: '#/components/schemas/GateOutcomeEnum'
        notes:
          type: string
      required:
      - outcome
    AreaEnum:
      enum:
      - comercial
      - financeiro
      - rh
      - juridico
