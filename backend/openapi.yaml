        status_display:
          type: string
          readOnly: true
        is_overdue:
          type: boolean
          readOnly: true
        issued_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        issued_by:
          type: integer
          readOnly: true
          nullable: true
        paid_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        settled_by:
          type: integer
          readOnly: true
          nullable: true
        cancelled_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
