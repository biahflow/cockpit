      type: object
      description: |-
        Projeção de entrega GitHub (FDD 041). O corpo só escreve o **mapeamento**.

        `project`, `handoff`, `repository` e `issue_number` são a referência canônica; todo o estado de
        engenharia (`issue_state`, `pr_state`, `head_sha`, `ci_state`, ...) é **somente-leitura** — quem
        o move é o webhook ou a reconciliação, nunca um PATCH do Pulse. É a fronteira da ADR 0046 escrita
        no serializer: uma edição normal do Pulse não reescreve o estado do GitHub.

        `repository`/`issue_number` não mudam depois de criados: re-ancorar uma projeção é reescrever
        qual Issue ela espelha, e isso está fora deste recorte.
      properties:
        id:
          type: integer
          readOnly: true
        project:
          type: integer
        handoff:
          type: integer
          nullable: true
        repository:
          type: string
          maxLength: 255
        issue_number:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        issue_url:
          type: string
          format: uri
          readOnly: true
        projection_status:
          allOf:
          - $ref: '#/components/schemas/ProjectionStatusEnum'
          readOnly: true
        state:
          type: string
          readOnly: true
        stale_after_seconds:
          type: integer
          readOnly: true
        issue_state:
          allOf:
          - $ref: '#/components/schemas/IssueStateEnum'
          readOnly: true
        pr_state:
          allOf:
          - $ref: '#/components/schemas/PrStateEnum'
          readOnly: true
        pr_number:
          type: integer
          readOnly: true
          nullable: true
        pr_url:
          type: string
          format: uri
          readOnly: true
        head_sha:
          type: string
          readOnly: true
        head_ref:
          type: string
          readOnly: true
        review_state:
          allOf:
          - $ref: '#/components/schemas/ReviewStateEnum'
          readOnly: true
        ci_state:
          allOf:
          - $ref: '#/components/schemas/CiStateEnum'
          readOnly: true
        observed_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        last_event_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        last_delivery_id:
          type: string
          readOnly: true
        last_event_type:
          type: string
          readOnly: true
        last_error_code:
          type: string
          readOnly: true
        last_error_message:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - ci_state
      - created_at
      - head_ref
      - head_sha
      - id
      - issue_number
      - issue_state
      - issue_url
      - last_delivery_id
