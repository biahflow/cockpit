        id:
          type: integer
          readOnly: true
        client:
          type: integer
        client_name:
          type: string
          readOnly: true
        project:
          type: integer
          nullable: true
        project_name:
          type: string
          readOnly: true
          default: ''
        service:
          type: integer
          nullable: true
        service_name:
          type: string
          readOnly: true
          default: ''
        number:
          type: string
          readOnly: true
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
