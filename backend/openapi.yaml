    Invoice:
      type: object
      description: |-
        A fatura (FDD 028).

        Duas travas que valem ser lidas juntas, porque a diferença entre elas é deliberada.

        **A do estado** é o mapa `INVOICE_TRANSITIONS` mais um segundo degrau que aponta a ação certa.
        O primeiro devolve o 400 de `paga → emitida`; o segundo existe porque emitir, baixar e cancelar
        são **atos com autor e carimbo** — um `PATCH status=paid` não carrega nem a data do provedor nem
        quem baixou, e aceitar isso produziria uma baixa sem procedência.

        **A dos campos** é um erro alto, e não o descarte silencioso que o `CaseSerializer` escolheu
        para a fotografia do case. Lá ninguém *queria* escrever `health_snapshot`; aqui, quem digita um
        novo `amount` numa fatura emitida **quis** — e um 200 que joga fora uma edição de dinheiro é o
        pior modo de falha disponível.
      properties:
        id:
          type: integer
          readOnly: true
        client:
          type: integer
        client_name:
          type: string
          readOnly: true
        project:
          type: integer
          nullable: true
        project_name:
          type: string
          readOnly: true
          default: ''
        service:
          type: integer
          nullable: true
        service_name:
          type: string
          readOnly: true
          default: ''
        number:
          type: string
          readOnly: true
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        description:
          type: string
          maxLength: 255
        due_date:
          type: string
          format: date
        method:
          oneOf:
          - $ref: '#/components/schemas/MethodEnum'
          - $ref: '#/components/schemas/BlankEnum'
        method_display:
          type: string
          readOnly: true
        status:
          $ref: '#/components/schemas/InvoiceStatusEnum'
        status_display:
          type: string
          readOnly: true
        is_overdue:
          type: boolean
          readOnly: true
        issued_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        issued_by:
          type: integer
          readOnly: true
          nullable: true
        paid_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        settled_by:
          type: integer
          readOnly: true
          nullable: true
        cancelled_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        cancelled_by:
          type: integer
          readOnly: true
          nullable: true
        cancel_reason:
          type: string
          readOnly: true
        provider:
          type: string
          readOnly: true
        external_reference:
          type: string
          readOnly: true
        payment_url:
          type: string
          format: uri
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - amount
      - cancel_reason
      - cancelled_at
      - cancelled_by
      - client
      - client_name
      - created_at
      - due_date
      - external_reference
      - id
      - is_overdue
      - issued_at
      - issued_by
      - method_display
      - number
      - paid_at
      - payment_url
      - project_name
      - provider
