  /api/v1/agents/{key}/:
    post:
      operationId: v1_agents_create
      description: Chat com um agente de IA especializado por área (revisão humana
        obrigatória).
      parameters:
      - in: path
        name: key
        schema:
          type: string
        required: true
      tags:
      - v1
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/AgentRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/AgentRequest'
        required: true
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentResponse'
          description: ''
  /api/v1/ai/feedback/:
    post:
      operationId: v1_ai_feedback_create
      description: Avaliação 👍/👎 de uma resposta da IA (só o dono da interação avalia).
      tags:
