        * `active` - Ativo
    CobrancaContato:
      type: object
      description: |-
        O que a casa já disse sobre uma fatura (FDD 036). **Só de leitura pelo router.**

        Nenhum campo é gravável aqui, e a ausência é a entrega: um `POST /cobranca/` criaria a prova de
        um contato que não aconteceu. Contato nasce de `POST /invoices/{id}/cobranca/enviar/` ou do job
        — os dois mandam o e-mail **antes** de gravar.
      properties:
        id:
          type: integer
          readOnly: true
        invoice:
          type: integer
          readOnly: true
        invoice_number:
          type: string
          readOnly: true
          default: ''
        client:
          type: integer
          readOnly: true
        client_name:
          type: string
          readOnly: true
        degrau:
          allOf:
          - $ref: '#/components/schemas/DegrauEnum'
          readOnly: true
        degrau_display:
          type: string
          readOnly: true
