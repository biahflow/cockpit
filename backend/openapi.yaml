        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 255
        legal_name:
          type: string
          maxLength: 255
        tax_id:
          type: string
          maxLength: 32
        owner:
          type: integer
          readOnly: true
        status:
          $ref: '#/components/schemas/ClientStatusEnum'
        vertical:
          type: integer
          nullable: true
        vertical_name:
          type: string
          readOnly: true
          default: ''
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - name
      - owner
      - updated_at
      - vertical_name
    ClientOverviewList:
      type: object
      properties:
        clients:
          type: array
          items: {}
      required:
