components:
  schemas:
    AcceptInvitation:
      type: object
      properties:
        token:
          type: string
          format: uuid
        username:
          type: string
          maxLength: 150
        password:
          type: string
          writeOnly: true
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
      required:
      - password
      - token
      - username
    AgentRequest:
      type: object
      properties:
        question:
          type: string
      required:
      - question
    AgentResponse:
      type: object
      properties:
        text:
          type: string
        interaction:
          type: integer
      required:
      - interaction
      - text
    AiFeedback:
      type: object
      properties:
        interaction:
          type: integer
        rating:
          type: integer
      required:
      - interaction
      - rating
    AiFitEnum:
      enum:
      - high
      - medium
      - low
      type: string
      description: |-
        * `high` - Alto
        * `medium` - Médio
        * `low` - Baixo
    AiMetrics:
      type: object
      properties:
        total:
          type: integer
        positive_rate:
          type: number
          format: double
          nullable: true
        by_feature:
          type: array
          items: {}
      required:
      - by_feature
      - positive_rate
      - total
    AnalyticsResponse:
      type: object
      properties:
        funnel:
          type: object
          additionalProperties: {}
        win_rate:
          type: number
          format: double
          nullable: true
        avg_ticket:
          type: number
          format: double
        avg_cycle_days:
          type: number
          format: double
          nullable: true
        pipeline:
          type: array
          items: {}
        roi:
          type: object
          additionalProperties: {}
      required:
      - avg_cycle_days
      - avg_ticket
      - funnel
      - pipeline
      - roi
      - win_rate
    Artifact:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        kind:
          $ref: '#/components/schemas/ArtifactKindEnum'
        kind_display:
          type: string
          readOnly: true
        status:
          $ref: '#/components/schemas/ArtifactStatusEnum'
        status_display:
          type: string
          readOnly: true
        title:
          type: string
          maxLength: 255
        content:
          type: string
        opportunity:
          type: integer
          nullable: true
        project:
          type: integer
          nullable: true
        source_meeting:
          type: integer
          readOnly: true
          nullable: true
        document:
          type: integer
          nullable: true
        ai_interaction:
          type: integer
          readOnly: true
          nullable: true
        created_by:
          type: integer
          readOnly: true
        sent_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        decided_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - ai_interaction
      - created_at
      - created_by
      - decided_at
      - id
      - kind
      - kind_display
      - sent_at
      - source_meeting
      - status_display
      - title
      - updated_at
    ArtifactKindEnum:
      enum:
      - discovery
      - assessment
      - proposal
      - contract
      type: string
      description: |-
        * `discovery` - Discovery
        * `assessment` - Assessment
        * `proposal` - Proposta
        * `contract` - Contrato
    ArtifactStatusEnum:
      enum:
      - draft
      - review
      - sent
      - accepted
      - rejected
      type: string
      description: |-
        * `draft` - Rascunho
        * `review` - Em revisão
        * `sent` - Enviado
        * `accepted` - Aceito
        * `rejected` - Recusado
