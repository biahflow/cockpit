          type: string
        vertical:
          type: integer
          readOnly: true
          nullable: true
        vertical_name:
          type: string
          readOnly: true
          default: ''
        client_name:
          type: string
          description: |-
            Vazio quando anonimizado — a anonimização vive aqui, e não na tela.

            Deixá-la para o frontend faria a resposta da API carregar o nome mesmo assim, e "não
            aparece" passaria a depender de todo consumidor lembrar de escondê-lo. Razão social e CNPJ
            nunca são projetados, anonimizado ou não: o case não precisa deles.
          readOnly: true
        metrics:
          readOnly: true
        health_snapshot:
          readOnly: true
        roi_snapshot:
          readOnly: true
        status:
          $ref: '#/components/schemas/CaseStatusEnum'
        status_display:
          type: string
          readOnly: true
        published_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        client_consent:
          type: boolean
          readOnly: true
        consent_recorded_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        consent_recorded_by:
          type: integer
          readOnly: true
          nullable: true
        anonymized:
          type: boolean
