          - $ref: '#/components/schemas/MethodEnum'
          - $ref: '#/components/schemas/BlankEnum'
        method_display:
          type: string
          readOnly: true
        status:
          $ref: '#/components/schemas/InvoiceStatusEnum'
        status_display:
          type: string
          readOnly: true
        is_overdue:
          type: boolean
          readOnly: true
        issued_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        issued_by:
          type: integer
          readOnly: true
          nullable: true
        paid_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        settled_by:
          type: integer
          readOnly: true
          nullable: true
        cancelled_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        cancelled_by:
          type: integer
          readOnly: true
          nullable: true
        cancel_reason:
          type: string
          readOnly: true
        provider:
          type: string
          readOnly: true
        external_reference:
          type: string
          readOnly: true
        payment_url:
          type: string
          format: uri
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
