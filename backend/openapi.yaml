      description: |-
        * `comercial` - Comercial
        * `financeiro` - Financeiro
        * `rh` - RH
        * `juridico` - Jurídico
        * `atendimento` - Atendimento
    Artifact:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        kind:
          $ref: '#/components/schemas/ArtifactKindEnum'
        kind_display:
          type: string
          readOnly: true
        status:
          $ref: '#/components/schemas/ArtifactStatusEnum'
        status_display:
          type: string
          readOnly: true
        title:
          type: string
          maxLength: 255
        content:
          type: string
        opportunity:
          type: integer
          nullable: true
        project:
          type: integer
          nullable: true
        source_meeting:
          type: integer
          readOnly: true
          nullable: true
        document:
          type: integer
          nullable: true
        ai_interaction:
          type: integer
          readOnly: true
          nullable: true
        created_by:
          type: integer
          readOnly: true
        sent_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        decided_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - ai_interaction
