      - id
      - kind
      - kind_display
      - sent_at
      - source_meeting
      - status_display
      - title
      - updated_at
    ArtifactKindEnum:
      enum:
      - discovery
      - assessment
      - proposal
      - contract
      type: string
      description: |-
        * `discovery` - Discovery
        * `assessment` - Assessment
        * `proposal` - Proposta
        * `contract` - Contrato
    ArtifactStatusEnum:
      enum:
      - draft
      - review
      - sent
      - accepted
      - rejected
      type: string
      description: |-
        * `draft` - Rascunho
        * `review` - Em revisão
        * `sent` - Enviado
        * `accepted` - Aceito
        * `rejected` - Recusado
    BlankEnum:
      enum:
      - ''
    BlueprintVariant:
      type: object
      description: Parametrização de um blueprint por vertical. Campo em branco herda
        o do blueprint.
      properties:
        id:
          type: integer
          readOnly: true
        blueprint:
          type: integer
        vertical:
          type: integer
        vertical_name:
          type: string
          readOnly: true
        description:
          type: string
        kpi_label:
          type: string
          maxLength: 80
        default_hours_saved_month:
          type: string
          format: decimal
          pattern: ^-?\d{0,9}(?:\.\d{0,1})?$
          nullable: true
        default_roi_month:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          nullable: true
      required:
      - blueprint
      - id
      - vertical
      - vertical_name
    BookingCreate:
      type: object
      properties:
        token:
          type: string
        slot_start:
          type: string
          format: date-time
      required:
      - slot_start
      - token
    BookingCreateResponse:
      type: object
      properties:
        starts_at:
          type: string
          format: date-time
        link:
          type: string
      required:
      - link
      - starts_at
    BookingSlotsResponse:
      type: object
      properties:
        slots:
          type: array
          items:
            type: string
            format: date-time
      required:
      - slots
    CalendarSyncResponse:
      type: object
      properties:
        created:
          type: integer
        skipped:
          type: integer
      required:
      - created
      - skipped
    CanalEnum:
      enum:
      - email
      - interno
      type: string
      description: |-
        * `email` - E-mail ao cliente
        * `interno` - Aviso interno
    CanonicalStageEnum:
      enum:
      - discover
      - prioritize
      - feasibility
      - prove
      - scale
      - optimize
      type: string
      description: |-
        * `discover` - Discover
        * `prioritize` - Prioritize
        * `feasibility` - Feasibility
        * `prove` - Prove
        * `scale` - Scale
        * `optimize` - Optimize
    Case:
      type: object
      description: |-
        O case de um projeto concluído (FDD 027).

        A lista de `read_only_fields` é a entrega, não burocracia: `metrics`, `health_snapshot` e
        `roi_snapshot` são a fotografia, e mantê-los fora da escrita é o que faz "os números não mudam
        depois de congelados" ser verdade por construção — não há caminho, em vez de haver um caminho
        que ninguém usa. O trio do consentimento fica de fora pelo motivo oposto: ele *deve* mudar, mas
        só pela ação `record-consent`, que grava quem autorizou.
      properties:
        id:
          type: integer
          readOnly: true
        project:
          type: integer
          readOnly: true
        project_name:
          type: string
          readOnly: true
        title:
          type: string
          maxLength: 255
        summary:
          type: string
        vertical:
          type: integer
          readOnly: true
          nullable: true
        vertical_name:
          type: string
          readOnly: true
          default: ''
        client_name:
          type: string
          description: |-
            Vazio quando anonimizado — a anonimização vive aqui, e não na tela.

            Deixá-la para o frontend faria a resposta da API carregar o nome mesmo assim, e "não
            aparece" passaria a depender de todo consumidor lembrar de escondê-lo. Razão social e CNPJ
            nunca são projetados, anonimizado ou não: o case não precisa deles.
          readOnly: true
        metrics:
          readOnly: true
        health_snapshot:
          readOnly: true
        roi_snapshot:
          readOnly: true
        status:
          $ref: '#/components/schemas/CaseStatusEnum'
        status_display:
          type: string
          readOnly: true
        published_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        client_consent:
          type: boolean
          readOnly: true
        consent_recorded_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        consent_recorded_by:
          type: integer
          readOnly: true
          nullable: true
        anonymized:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - client_consent
      - client_name
      - consent_recorded_at
      - consent_recorded_by
      - created_at
      - health_snapshot
      - id
      - metrics
      - project
      - project_name
      - published_at
      - roi_snapshot
      - status_display
      - title
      - updated_at
      - vertical
      - vertical_name
    CaseStatusEnum:
      enum:
      - draft
      - review
      - published
      type: string
      description: |-
        * `draft` - Rascunho
        * `review` - Em revisão
        * `published` - Publicado
    CategoryEnum:
      enum:
      - acquisition
      - commercial
      type: string
      description: |-
        * `acquisition` - Aquisição
        * `commercial` - Comercial
    ChangePassword:
