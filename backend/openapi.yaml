      enum:
      - admin
      - sales
      - delivery
      type: string
      description: |-
        * `admin` - Administrador
        * `sales` - Vendas
        * `delivery` - Entrega
    Service:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 120
        active:
          type: boolean
        tier:
          oneOf:
          - $ref: '#/components/schemas/TierEnum'
          - $ref: '#/components/schemas/BlankEnum'
        tier_display:
          type: string
          readOnly: true
        list_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        summary:
          type: string
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - name
      - tier_display
      - updated_at
    SignatureRequest:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        signer_email:
          type: string
          format: email
          readOnly: true
        status:
          allOf:
          - $ref: '#/components/schemas/SignatureRequestStatusEnum'
          readOnly: true
        sign_url:
          type: string
          format: uri
          readOnly: true
        reminded_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        signed_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - reminded_at
      - sign_url
      - signed_at
      - signer_email
      - status
    SignatureRequestStatusEnum:
      enum:
      - pending
      - signed
      - declined
      type: string
      description: |-
        * `pending` - Pendente
        * `signed` - Assinado
        * `declined` - Recusado
    SourceEnum:
      enum:
      - linear
      - github
      type: string
      description: |-
        * `linear` - linear
        * `github` - github
    Task:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        project:
          type: integer
        title:
          type: string
          maxLength: 255
        description:
          type: string
        owner:
          type: integer
          readOnly: true
        due_date:
          type: string
          format: date
        completed_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        status:
          $ref: '#/components/schemas/WorkItemStatusEnum'
        is_overdue:
          type: boolean
          readOnly: true
        party:
          $ref: '#/components/schemas/PartyEnum'
        source:
          type: string
          readOnly: true
          default: biahflow
        external_id:
          type: string
          readOnly: true
          default: ''
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        milestone:
          type: integer
          nullable: true
      required:
      - completed_at
      - created_at
      - due_date
      - external_id
      - id
      - is_overdue
      - owner
      - project
      - source
      - title
      - updated_at
    TaskSync:
      type: object
      description: Entrada do webhook de sincronia (Linear/GitHub → Biahflow).
      properties:
        source:
          $ref: '#/components/schemas/SourceEnum'
        external_id:
          type: string
          maxLength: 128
        external_status:
          type: string
          maxLength: 64
      required:
      - external_id
      - external_status
      - source
    TierEnum:
      enum:
      - discovery_express
      - discovery_assessment
      - implantacao
      type: string
      description: |-
        * `discovery_express` - Discovery Express
        * `discovery_assessment` - Discovery + Assessment
        * `implantacao` - Implantação
    User:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        username:
          type: string
          title: Usuário
          description: Obrigatório. 150 caracteres ou menos. Letras, números e @/./+/-/_
            apenas.
          pattern: ^[\w.@+-]+$
          maxLength: 150
        first_name:
          type: string
          title: Primeiro nome
          maxLength: 150
        last_name:
          type: string
          title: Último nome
          maxLength: 150
        email:
          type: string
          format: email
          title: Endereço de email
          maxLength: 254
        role:
          $ref: '#/components/schemas/RoleEnum'
      required:
      - id
      - username
    WorkItemStatusEnum:
      enum:
      - todo
      - in_progress
      - done
      type: string
      description: |-
        * `todo` - A fazer
        * `in_progress` - Em andamento
        * `done` - Concluído
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
