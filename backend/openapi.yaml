          format: date-time
          readOnly: true
        milestone:
          type: integer
          nullable: true
      required:
      - completed_at
      - created_at
      - due_date
      - external_id
      - id
      - is_overdue
      - owner
      - project
      - source
      - title
      - updated_at
    TaskSync:
      type: object
      description: Entrada do webhook de sincronia (Linear/GitHub → Biahflow).
      properties:
        source:
          $ref: '#/components/schemas/SourceEnum'
        external_id:
          type: string
          maxLength: 128
        external_status:
          type: string
          maxLength: 64
      required:
      - external_id
      - external_status
      - source
    TierEnum:
      enum:
      - qualification_call
      - discovery_assessment
      - discovery_sprint
      - feasibility
      - prove
      - scale
      - transformation
      type: string
      description: |-
        * `qualification_call` - Qualification Call
        * `discovery_assessment` - Discovery Express + Assessment
        * `discovery_sprint` - Discovery Sprint
        * `feasibility` - Technical Feasibility (T.O.E.)
        * `prove` - PROVE (piloto)
        * `scale` - Scale
        * `transformation` - Transformation Partnership
    TimelineBlocker:
      type: object
      properties:
        phase_name:
          type: string
        waiting_party:
          type: string
        blocker_note:
          type: string
      required:
      - blocker_note
      - phase_name
      - waiting_party
    TimelineNextGate:
      type: object
      properties:
        phase_name:
          type: string
        canonical_stage:
          type: string
      required:
      - canonical_stage
      - phase_name
    TimelineNextPhase:
      type: object
      properties:
        phase_name:
          type: string
        canonical_stage:
          type: string
      required:
      - canonical_stage
      - phase_name
    Unarchived:
      type: object
      properties:
        id:
          type: integer
      required:
      - id
    User:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        username:
          type: string
          title: Usuário
          description: Obrigatório. 150 caracteres ou menos. Letras, números e @/./+/-/_
            apenas.
          pattern: ^[\w.@+-]+$
          maxLength: 150
        first_name:
          type: string
          title: Primeiro nome
          maxLength: 150
        last_name:
          type: string
          title: Último nome
          maxLength: 150
        email:
          type: string
          format: email
          title: Endereço de email
          maxLength: 254
        role:
          $ref: '#/components/schemas/RoleEnum'
        is_admin:
          type: boolean
          readOnly: true
        has_avatar:
          type: boolean
          readOnly: true
        avatar_updated_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
      required:
      - avatar_updated_at
      - has_avatar
      - id
      - is_admin
      - username
    Vertical:
      type: object
      description: Setor do cliente (config admin, vocabulário editável — FDD 026).
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 80
        slug:
          type: string
          maxLength: 80
          pattern: ^[-a-zA-Z0-9_]+$
        position:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        active:
          type: boolean
      required:
      - id
      - name
      - slug
    WaitingPartyEnum:
      enum:
      - biahflow
      - client
      - engineering
      - external
      - human_gate
      type: string
      description: |-
        * `biahflow` - Biahflow
        * `client` - Cliente
        * `engineering` - Engenharia
        * `external` - Dependência externa
        * `human_gate` - Human Gate
    WorkItemStatusEnum:
      enum:
      - todo
      - in_progress
      - done
      type: string
      description: |-
        * `todo` - A fazer
        * `in_progress` - Em andamento
        * `done` - Concluído
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sessionid
