    Case:
      type: object
      description: |-
        O case de um projeto concluído (FDD 027).

        A lista de `read_only_fields` é a entrega, não burocracia: `metrics`, `health_snapshot` e
        `roi_snapshot` são a fotografia, e mantê-los fora da escrita é o que faz "os números não mudam
        depois de congelados" ser verdade por construção — não há caminho, em vez de haver um caminho
        que ninguém usa. O trio do consentimento fica de fora pelo motivo oposto: ele *deve* mudar, mas
        só pela ação `record-consent`, que grava quem autorizou.
      properties:
        id:
          type: integer
          readOnly: true
        project:
          type: integer
          readOnly: true
        project_name:
          type: string
          readOnly: true
        title:
          type: string
          maxLength: 255
        summary:
          type: string
        vertical:
          type: integer
          readOnly: true
          nullable: true
        vertical_name:
          type: string
          readOnly: true
          default: ''
        account_name:
          type: string
          description: |-
            Vazio quando anonimizado — a anonimização vive aqui, e não na tela.

            Deixá-la para o frontend faria a resposta da API carregar o nome mesmo assim, e "não
            aparece" passaria a depender de todo consumidor lembrar de escondê-lo. Razão social e CNPJ
            nunca são projetados, anonimizado ou não: o case não precisa deles.
          readOnly: true
        metrics:
          readOnly: true
        health_snapshot:
          readOnly: true
        roi_snapshot:
          readOnly: true
        status:
          $ref: '#/components/schemas/CaseStatusEnum'
        status_display:
          type: string
          readOnly: true
        published_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        account_consent:
          type: boolean
          readOnly: true
        consent_recorded_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        consent_recorded_by:
          type: integer
          readOnly: true
          nullable: true
        anonymized:
          type: boolean
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - account_consent
      - account_name
      - consent_recorded_at
      - consent_recorded_by
      - created_at
      - health_snapshot
      - id
      - metrics
      - project
      - project_name
      - published_at
      - roi_snapshot
      - status_display
      - title
      - updated_at
      - vertical
      - vertical_name
