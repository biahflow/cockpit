          type: string
          readOnly: true
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
          nullable: true
        quantity:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
          nullable: true
        period_start:
          type: string
          format: date
        period_end:
          type: string
          format: date
        attribution_method:
          type: string
        status:
          $ref: '#/components/schemas/ValueLedgerEntryStatusEnum'
        status_display:
