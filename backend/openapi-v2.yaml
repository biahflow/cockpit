    PainPoint:
      type: object
      description: |-
        A dor observada, com a invariante de `confirmed` (FDD 048).

        **`confirmed` exige ao menos um `Finding` vivo por baixo**, e a checagem mora aqui inteira —
        não por preferência, mas porque ela pergunta pelo M2M, que só existe depois do save. É a mesma
        razão pela qual a metade "evidência viva" da invariante §6.9 está no `FindingSerializer` e não
        no `clean()` do `Finding`. A terceira metade da mesma regra está no arquivamento
        (`FindingViewSet.perform_destroy`): sem ela, a invariante vazaria pelo `DELETE`, que foi como
        a Fase 3 a perdeu da primeira vez.

        `impact_estimate` ausente fica **nulo**, e o serializer não o converte em zero em lugar
        nenhum: zero afirma que a dor não custa nada, e nulo diz que ninguém estimou.

        **A quinta porta da cadeia de publicação também passa por aqui** (FDD 051): mover
        `process`/`step` de uma dor **publicada** para um mapa não publicado é 400 — a dor emite
        `process_id`/`step_id` no snapshot como o achado emite.
      properties:
        id:
          type: integer
          readOnly: true
        account:
          type: integer
        process:
          type: integer
          nullable: true
        step:
          type: integer
          nullable: true
        title:
          type: string
          maxLength: 200
        description:
          type: string
        impact_type:
          $ref: '#/components/schemas/ImpactTypeEnum'
        impact_type_display:
          type: string
          readOnly: true
        impact_estimate:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          nullable: true
        findings:
          type: array
          items:
            type: integer
        status:
          $ref: '#/components/schemas/PainPointStatusEnum'
        status_display:
          type: string
          readOnly: true
        published_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        published_by:
          type: integer
          readOnly: true
          nullable: true
        publication_state:
          allOf:
          - $ref: '#/components/schemas/PublicationState'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - account
      - created_at
      - id
      - impact_type
      - impact_type_display
      - publication_state
      - published_at
      - published_by
      - status_display
