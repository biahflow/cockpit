        status_display:
          type: string
          readOnly: true
        published_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        published_by:
          type: integer
          readOnly: true
          nullable: true
        publication_state:
          allOf:
          - $ref: '#/components/schemas/PublicationState'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
