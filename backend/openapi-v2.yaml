    ValueLedgerEntry:
      type: object
      description: |-
        A entrada do Value Ledger (FDD 049, `language-map` §6.11 e §6.12).

        Três recusas, e nenhuma é decorativa:

        - **a medição apontada tem de ser um `outcome`** — uma entrada que apontasse para o baseline
          afirmaria resultado onde há ponto de partida, e a leitura da tela não denunciaria nada;
        - **`attribution_method` não pode ser vazio** — é ele que separa valor medido de número
          escrito à mão, e "ROI" como resultado é termo banido (§5) por causa disso;
        - **`approved` exige `approved_by`** — aprovar é ato com autor, e o carimbo `approved_at` sai
          do `save()` do modelo, como o `published_at` do `Case`.
      properties:
        id:
          type: integer
          readOnly: true
        engagement:
          type: integer
        project:
          type: integer
          nullable: true
        outcome_measurement:
          type: integer
        value_type:
          $ref: '#/components/schemas/ValueTypeEnum'
        value_type_display:
          type: string
          readOnly: true
        amount:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
          nullable: true
        quantity:
          type: string
          format: decimal
          pattern: ^-?\d{0,12}(?:\.\d{0,2})?$
          nullable: true
        period_start:
          type: string
          format: date
        period_end:
          type: string
          format: date
        attribution_method:
          type: string
        status:
          $ref: '#/components/schemas/ValueLedgerEntryStatusEnum'
        status_display:
          type: string
          readOnly: true
        approved_by:
          type: integer
          nullable: true
        approved_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - approved_at
      - attribution_method
      - created_at
      - engagement
      - id
      - outcome_measurement
      - period_end
      - period_start
      - status_display
      - updated_at
      - value_type
      - value_type_display
    ValueLedgerEntryStatusEnum:
