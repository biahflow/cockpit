        id:
          type: integer
          readOnly: true
        project:
          type: integer
        blueprint:
          type: integer
          readOnly: true
          nullable: true
        kpi:
          type: integer
          nullable: true
        name:
          type: string
          maxLength: 120
        area:
          type: string
          maxLength: 80
        description:
          type: string
        status:
          $ref: '#/components/schemas/DigitalEmployeeStatusEnum'
        kpi_label:
          type: string
          maxLength: 80
        kpi_value:
          type: string
          maxLength: 80
        kpi_unit:
          oneOf:
          - $ref: '#/components/schemas/KpiUnitEnum'
          - $ref: '#/components/schemas/BlankEnum'
        kpi_direction:
          $ref: '#/components/schemas/KpiDirectionEnum'
        hours_saved_month:
          type: string
          format: decimal
          pattern: ^-?\d{0,9}(?:\.\d{0,1})?$
        roi_month:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - blueprint
      - created_at
      - id
      - name
      - project
      - updated_at
