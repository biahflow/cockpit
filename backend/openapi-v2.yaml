          type: integer
          nullable: true
        gap_waiver_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        missing_to_start:
          type: array
          items:
            type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
