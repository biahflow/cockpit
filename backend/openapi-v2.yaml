          type: integer
          readOnly: true
        account:
          type: integer
        account_name:
          type: string
          readOnly: true
        project:
          type: integer
          nullable: true
        project_name:
          type: string
          readOnly: true
          default: ''
        service:
          type: integer
          nullable: true
        service_name:
          type: string
          readOnly: true
          default: ''
        number:
          type: string
          readOnly: true
        amount:
