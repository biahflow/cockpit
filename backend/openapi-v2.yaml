components:
  schemas:
    AcceptInvitation:
      type: object
      properties:
        token:
          type: string
          format: uuid
        username:
          type: string
          maxLength: 150
        password:
          type: string
          writeOnly: true
        first_name:
          type: string
          maxLength: 150
        last_name:
          type: string
          maxLength: 150
      required:
      - password
      - token
      - username
    Account:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 255
        legal_name:
          type: string
          maxLength: 255
        tax_id:
          type: string
          maxLength: 32
        owner:
          type: integer
          readOnly: true
        lifecycle_status:
          $ref: '#/components/schemas/LifecycleStatusEnum'
        vertical:
          type: integer
          nullable: true
        vertical_name:
          type: string
          readOnly: true
          default: ''
        published_count:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - name
      - owner
      - published_count
      - updated_at
      - vertical_name
    AccountOverviewAiScore:
      type: object
      properties:
        maturity:
          type: integer
          nullable: true
        opportunity:
          type: integer
          nullable: true
        dimensions: {}
        summary:
          type: string
        scored_at:
          type: string
          format: date-time
      required:
      - dimensions
      - maturity
      - opportunity
      - scored_at
      - summary
    AccountOverviewDetail:
      type: object
      properties:
        account_id:
          type: integer
        name:
          type: string
        lifecycle_status:
          type: string
        roi:
          $ref: '#/components/schemas/AccountOverviewRoi'
        health:
          allOf:
          - $ref: '#/components/schemas/AccountOverviewHealth'
          nullable: true
        risk_level:
          type: string
          nullable: true
