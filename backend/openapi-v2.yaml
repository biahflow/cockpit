    ApplyGate:
      type: object
      properties:
        decision:
          allOf:
          - $ref: '#/components/schemas/GateDecisionEnum'
          description: |-
            As sete saídas dos dois vocabulários (ADR 0053). O esquema aceita todas porque não sabe de qual fase se trata; **quem estreita é o servidor**, pelo `canonical_stage` da fase ativa — `prove` aceita SCALE / ITERATE / STOP, e qualquer outra fase de gate aceita GO / CONDITIONAL GO / REDESIGN / NO-GO. Fora do vocabulário da fase é 400.

            * `go` - GO
            * `conditional_go` - CONDITIONAL GO
            * `redesign` - REDESIGN
            * `no_go` - NO-GO
            * `scale` - SCALE
            * `iterate` - ITERATE
            * `stop` - STOP
        outcome:
          allOf:
          - $ref: '#/components/schemas/GateDecisionEnum'
          description: |-
            Alias depreciado de `decision` (D7, ADR 0052). Continua aceito na `/api/v1/`; saiu na `/api/v2/`, que recusa (400) e diz `decision`.

            * `go` - GO
            * `conditional_go` - CONDITIONAL GO
            * `redesign` - REDESIGN
            * `no_go` - NO-GO
            * `scale` - SCALE
            * `iterate` - ITERATE
            * `stop` - STOP
        notes:
          type: string
      required:
      - decision
