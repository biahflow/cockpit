# Topologia de produção (FDD 019, ADR 0011). Autônomo de propósito, **não** um override do
# `docker-compose.yml`: override não remove um bind mount nem um serviço herdado, então herdar
# levaria a árvore de código, o Mailpit e o MinIO para produção.
#
#   docker compose -f docker-compose.prod.yml up -d --build
#
# O TLS é terminado por um proxy **na frente** deste compose (o do provedor, ou um nginx/Caddy
# seu). Ele precisa sobrescrever `X-Forwarded-Proto` — ver o aviso na ADR 0011.
# Passo a passo em docs/runbooks/producao.md.

# Nome de projeto próprio. Sem isto, o compose usa o nome do diretório para os dois arquivos, e
# produção acabaria anexada ao **mesmo volume de banco** do ambiente de desenvolvimento — além de um
# `down` aqui poder mexer nos containers de lá.
name: biahflow-prod

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?defina POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER:?defina POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped
    # Sem porta publicada: o banco só é alcançável pela rede interna do compose.

  redis:
    image: redis:7-alpine
    # `--save ""` desliga a persistência: aqui o Redis só guarda contador de teto de requisição,
    # que pode ser perdido sem consequência. Perder o dado é degradação; perder o Redis é queda.
    command: redis-server --save "" --appendonly no
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Migração como passo próprio, não embutida no boot do servidor: com mais de uma réplica, N
  # processos correndo `migrate` ao mesmo tempo é problema, e um `migrate` que falha precisa
  # aparecer como falha em vez de virar um servidor que subiu pela metade.
  api-migrate:
    build:
      context: ./backend
      target: prod
    command: ["python", "manage.py", "migrate", "--noinput"]
    env_file:
      - path: .env
        required: false
    environment: &api_env
      DATABASE_URL: postgresql://${POSTGRES_USER:?}:${POSTGRES_PASSWORD:?}@db:5432/${POSTGRES_DB:?}
      REDIS_URL: redis://redis:6379/0
      DJANGO_DEBUG: "false"
      DJANGO_MEDIA_ROOT: /var/lib/biahflow/media
      # Transporte: nada disto é ligado por default no código, justamente porque `DEBUG=False`
      # também é o modo da suíte de testes. Aqui é produção, então liga.
      DJANGO_SSL_REDIRECT: ${DJANGO_SSL_REDIRECT:-true}
      DJANGO_HSTS_SECONDS: ${DJANGO_HSTS_SECONDS:-31536000}
      # O nginx do serviço `web` é o único salto interno; se houver proxy do provedor na frente,
      # aumente o número.
      TRUST_X_FORWARDED_PROTO: ${TRUST_X_FORWARDED_PROTO:-true}
      NUM_PROXIES: ${NUM_PROXIES:-1}
      # Monitoramento (FDD 020). JSON aqui e não no código porque log em JSON no terminal de quem
      # desenvolve é hostil de ler; produção tem um coletor que indexa campo. O `SENTRY_*` vem do
      # `.env` pelo `env_file`; vazio = rastreamento de erro desligado.
      DJANGO_LOG_FORMAT: ${DJANGO_LOG_FORMAT:-json}
      # Backup (FDD 021). A API não faz backup nenhum — só lê o carimbo que o sidecar deixa, para
      # o `manage.py backup_status` poder dizer se o backup parou de rodar.
      BACKUP_ROOT: /var/lib/biahflow/backups
      BACKUP_MAX_AGE_HOURS: ${BACKUP_MAX_AGE_HOURS:-26}
    volumes:
      - media_data:/var/lib/biahflow/media
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: ./backend
      target: prod
    env_file:
      - path: .env
        required: false
    environment: *api_env
    # `MEDIA_ROOT` em volume nomeado. No compose de desenvolvimento ele mora dentro do bind mount
    # da árvore de código — em produção isso significaria perder todo documento de cliente no
    # primeiro deploy.
    volumes:
      - media_data:/var/lib/biahflow/media
      # Só-leitura, e só pelo carimbo: quem escreve aqui é o sidecar `backup`. Montar rw daria ao
      # processo que atende a internet permissão de apagar as cópias — que é exatamente o que um
      # ransomware procura depois de entrar pela aplicação.
      - backup_data:/var/lib/biahflow/backups:ro
    healthcheck:
      # `/readyz` e não `/healthz`: aqui a pergunta é "pode entrar no balanceador?", e um container
      # que subiu sem alcançar o banco não pode. A sonda de liveness (`/healthz`) é a do
      # orquestrador que reinicia — reiniciar não traz o Postgres de volta (FDD 020).
      #
      # Sem `Host` nem `X-Forwarded-Proto` forjados: a sonda responde antes de `ALLOWED_HOSTS` e do
      # redirect de https, que é o motivo de ser middleware. A versão anterior sondava
      # `/api/v1/auth/csrf/` com `Host: 127.0.0.1` e levava 400 assim que
      # `DJANGO_ALLOWED_HOSTS` virava o domínio real — o container nunca ficava saudável e o `web`
      # nunca subia.
      test: ["CMD", "python", "-c", "import urllib.request as r; assert r.urlopen('http://127.0.0.1:8000/readyz', timeout=5).status == 200"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 20s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      api-migrate:
        condition: service_completed_successfully
    restart: unless-stopped
    # Sem porta publicada: quem fala com o gunicorn é o nginx do serviço `web`. Publicar aqui
    # daria um caminho que não passa pelo proxy — e é justamente o que torna
    # `TRUST_X_FORWARDED_PROTO` perigoso (ADR 0011).

  web:
    build:
      context: ./frontend
      target: prod
      # O SPA é estático: o que ele sabe do Sentry é decidido no **build**, não em runtime
      # (`import.meta.env` é substituído por literal). Trocar o DSN exige reconstruir a imagem.
      # DSN de Sentry é público por desenho — identifica o projeto e só aceita escrita.
      args:
        VITE_SENTRY_DSN: ${VITE_SENTRY_DSN:-}
        VITE_SENTRY_ENVIRONMENT: ${SENTRY_ENVIRONMENT:-}
        VITE_SENTRY_RELEASE: ${SENTRY_RELEASE:-}
    ports:
      # Só HTTP: o terminador de TLS fica na frente. Não exponha esta porta à internet direto.
      - "${WEB_PORT:-8080}:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  # Backup do banco e dos documentos (FDD 021, ADR 0013).
  #
  # Imagem própria e não a da API: `pg_dump` recusa rodar contra um servidor de major maior que a
  # dele, e a imagem da API é Debian bookworm (postgresql-client 15) contra um servidor 16. Aqui a
  # base é o mesmo `postgres:16-alpine` do serviço `db` — trocar a major de um obriga a trocar do
  # outro. De quebra, o backup não depende do build da aplicação: API quebrada, ainda se restaura.
  #
  # Restauração é manual e destrutiva, pelo mesmo container:
  #   docker compose -f docker-compose.prod.yml stop api web
  #   docker compose -f docker-compose.prod.yml exec backup restore.sh --latest --yes
  # Passo a passo em docs/runbooks/backup-e-restauracao.md.
  backup:
    build:
      context: ./ops/backup
    env_file:
      - path: .env
        required: false
    environment:
      # Variáveis padrão do libpq: a senha vai por ambiente e nunca na linha de comando, que
      # qualquer `ps` no host mostraria.
      PGHOST: db
      PGPORT: "5432"
      PGDATABASE: ${POSTGRES_DB:?defina POSTGRES_DB}
      PGUSER: ${POSTGRES_USER:?defina POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD}
      BACKUP_ROOT: /backups
      BACKUP_MEDIA_ROOT: /media
      # Padrão diário, 03:15 no fuso do container. `TZ` vem do `.env` se houver.
      BACKUP_CRON: ${BACKUP_CRON:-15 3 * * *}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-14}
      # Offsite opt-in: vazio, o backup é só local — que é melhor que nenhum, mas não sobrevive
      # ao host. Preenchido, cada cópia sobe para o bucket. Ver o runbook.
      BACKUP_S3_BUCKET: ${BACKUP_S3_BUCKET:-}
      BACKUP_S3_PREFIX: ${BACKUP_S3_PREFIX:-}
      BACKUP_S3_ENDPOINT: ${BACKUP_S3_ENDPOINT:-}
      BACKUP_S3_REGION: ${BACKUP_S3_REGION:-}
      BACKUP_S3_PROVIDER: ${BACKUP_S3_PROVIDER:-Other}
      BACKUP_S3_ACCESS_KEY: ${BACKUP_S3_ACCESS_KEY:-}
      BACKUP_S3_SECRET_KEY: ${BACKUP_S3_SECRET_KEY:-}
    volumes:
      - backup_data:/backups
      # Leitura e escrita, apesar de o backup só ler: a **restauração** roda neste mesmo container
      # e precisa devolver os arquivos. Separar em dois serviços para ganhar o `:ro` no caminho
      # feliz custaria uma imagem duplicada e um serviço que ninguém lembra de manter.
      - media_data:/media
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres_data:
  media_data:
  # As cópias. Volume próprio de propósito: um `down -v` leva junto, e é o que o runbook avisa
  # antes de mandar rodar qualquer coisa com `-v`.
  backup_data:
