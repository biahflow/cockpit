services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-biahflow}
      POSTGRES_USER: ${POSTGRES_USER:-biahflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "19025:8025"

  api:
    build: ./backend
    command: sh -c "uv sync --no-dev && uv run python manage.py migrate && uv run python manage.py runserver 0.0.0.0:8000"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-biahflow}:${POSTGRES_PASSWORD:-change-me}@db:5432/${POSTGRES_DB:-biahflow}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-unsafe-development-key}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-true}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1},api
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-http://localhost:19173,http://127.0.0.1:19173}
      EMAIL_HOST: mailpit
      EMAIL_PORT: 1025
      MINIO_ENDPOINT: http://minio:9000
      GOOGLE_DRIVE_ENABLED: ${GOOGLE_DRIVE_ENABLED:-false}
      GOOGLE_SERVICE_ACCOUNT_INFO: ${GOOGLE_SERVICE_ACCOUNT_INFO:-}
      GOOGLE_DRIVE_ROOT_FOLDER_ID: ${GOOGLE_DRIVE_ROOT_FOLDER_ID:-}
      LEAD_INTAKE_TOKEN: ${LEAD_INTAKE_TOKEN:-}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      AI_ENABLED: ${AI_ENABLED:-false}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-gpt-4o-mini}
      CALENDAR_ENABLED: ${CALENDAR_ENABLED:-false}
      GOOGLE_CALENDAR_ID: ${GOOGLE_CALENDAR_ID:-}
      ESIGN_ENABLED: ${ESIGN_ENABLED:-false}
      ESIGN_PROVIDER: ${ESIGN_PROVIDER:-}
      ESIGN_API_TOKEN: ${ESIGN_API_TOKEN:-}
      ESIGN_API_BASE: ${ESIGN_API_BASE:-}
      ESIGN_SANDBOX: ${ESIGN_SANDBOX:-true}
      ESIGN_DELIVERY: ${ESIGN_DELIVERY:-email}
      ESIGN_WEBHOOK_SECRET: ${ESIGN_WEBHOOK_SECRET:-}
    volumes:
      - ./backend:/app
      - api_venv:/app/.venv
    ports:
      - "19000:8000"
    depends_on:
      db:
        condition: service_healthy

  web:
    build: ./frontend
    command: npm run dev -- --host 0.0.0.0 --port 19173
    environment:
      VITE_PROXY_TARGET: http://api:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "19173:19173"
    depends_on:
      - api

volumes:
  postgres_data:
  minio_data:
  api_venv:
