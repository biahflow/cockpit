services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-biahflow}
      POSTGRES_USER: ${POSTGRES_USER:-biahflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres_data:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "19025:8025"

  api:
    build:
      context: ./backend
      target: dev
    command: sh -c "uv sync --no-dev && uv run python manage.py migrate && uv run python manage.py runserver 0.0.0.0:8000"
    # O `.env` inteiro entra no container. Antes, esta lista repetia ~26 das ~60 variáveis que o
    # `settings.py` lê, e as que faltavam (`FRONTEND_ORIGIN`, `PORTAL_*`, `TASKSYNC_*`,
    # `NUM_PROXIES`, todos os `*_RATE`) eram descartadas em silêncio — daí o "botei no .env e não
    # aconteceu nada". `required: false` porque quem só roda `docker compose config` (o CI) não
    # tem `.env`.
    env_file:
      - path: .env
        required: false
    # Só o que é interno ao compose e não pode vir do `.env`. `environment` vence o `env_file`.
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-biahflow}:${POSTGRES_PASSWORD:-change-me}@db:5432/${POSTGRES_DB:-biahflow}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:-unsafe-development-key}
      DJANGO_DEBUG: ${DJANGO_DEBUG:-true}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1},api
      DJANGO_CSRF_TRUSTED_ORIGINS: ${DJANGO_CSRF_TRUSTED_ORIGINS:-http://localhost:19173,http://127.0.0.1:19173}
      EMAIL_HOST: mailpit
      EMAIL_PORT: 1025
      MINIO_ENDPOINT: http://minio:9000
    volumes:
      - ./backend:/app
      - api_venv:/app/.venv
    ports:
      - "19000:8000"
    depends_on:
      db:
        condition: service_healthy

  web:
    build:
      context: ./frontend
      target: dev
    command: npm run dev -- --host 0.0.0.0 --port 19173
    environment:
      VITE_PROXY_TARGET: http://api:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "19173:19173"
    depends_on:
      - api

volumes:
  postgres_data:
  minio_data:
  api_venv:
