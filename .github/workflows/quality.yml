name: Qualidade

# TEMPORARY SPEED MODE — 2026-08-24
#
# Automatic PR/main execution is intentionally paused while delivery velocity is prioritized.
# Local validation remains the active engineering gate during this period.
#
# To re-enable the previous behavior, restore:
#
# on:
#   pull_request:
#   push:
#     branches: [main]
#
# Keep this workflow available manually for spot checks before important merges/releases.
on:
  workflow_dispatch:

# Cancela o que foi superado **só em PR**, nunca em `main`.
#
# A assimetria é o ponto. Numa PR, o terceiro push torna os dois primeiros irrelevantes, e cada um
# deles custa a suíte inteira mais o `backup-drill`, que sobe a topologia de produção em
# containers, destrói banco e mídia e restaura — pagar isso por um commit que ninguém vai ler é
# desperdício puro.
#
# Em `main` é o contrário, e por uma razão que só aparece quando dois PRs entram juntos: o merge é
# commit de verdade, então a árvore mergeada não é a árvore de nenhuma das duas PRs. Foi o que
# aconteceu com os PRs #13 e #14 — o segundo mergeou o primeiro junto, e aquela combinação nunca
# tinha sido testada em lugar nenhum. Cancelar o run de `main` porque outro merge chegou depois
# apagaria a única execução que viu o que de fato está no repositório.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker compose --env-file .env.example config --quiet
      - run: docker compose -f docker-compose.prod.yml --env-file .env.example config --quiet

  # Teste de mesa da restauração (FDD 021, ADR 0013). Backup que ninguém nunca restaurou não é
  # backup, é fé — então o repositório restaura a cada PR: semeia dado real na topologia de
  # produção, faz a cópia, **destrói banco e documentos**, restaura e confere que voltaram.
  #
  # Job próprio e não um passo do `compose`: aquele valida sintaxe em segundos, este sobe
  # containers e leva alguns minutos.
  backup-drill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: bash .github/scripts/backup-drill.sh

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      - run: uv run python ../.github/scripts/test_release_evidence.py
      - run: uv run python ../.github/scripts/test_docs_links.py
      - run: uv run ruff check .
      - run: uv run mypy apps config
      - run: uv run pip-audit
      - run: uv run python manage.py check
      - run: uv run python manage.py makemigrations --check --dry-run
      - run: uv run pytest
      - run: uv run python manage.py spectacular --file openapi.yaml --validate
      - run: git diff --exit-code -- openapi.yaml
      # O corpus de conhecimento é derivado de docs/ e PRD.md e vive commitado, exatamente como o
      # OpenAPI acima: editou metodologia, regera e commita. A fricção é de propósito — "mudei o
      # método" vira ato visível e revisado, em vez de o índice divergir do repositório em silêncio.
      - run: uv run python manage.py build_knowledge_corpus
      - run: git diff --exit-code -- apps/core/knowledge_corpus.jsonl
      # Gate de produção (FDD 019), o que a FDD 017 tinha deixado pendente. Simula o ambiente que o
      # cofre de segredos vai entregar e cobra que `check --deploy` saia limpo.
      #
      # Por último de propósito: o `collectstatic` cria o `staticfiles/`, e é a existência dele que
      # liga o WhiteNoise no MIDDLEWARE. Antes do `pytest`, a suíte rodaria em uma configuração
      # diferente da local.
      #
      # `--tag security` porque `check --deploy` cru também levanta avisos de schema do
      # drf-spectacular, e este gate é sobre estar pronto para produção, não sobre o OpenAPI. O
      # segredo é gerado no shell: literal de 50 caracteres em workflow é fumaça para varredor de
      # segredo, e este não precisa ser estável.
      - name: check --deploy (produção simulada)
        env:
          DJANGO_DEBUG: "false"
          DJANGO_ALLOWED_HOSTS: portal.exemplo.com
          DJANGO_CSRF_TRUSTED_ORIGINS: https://portal.exemplo.com
          FRONTEND_ORIGIN: https://portal.exemplo.com
          DJANGO_SSL_REDIRECT: "true"
          DJANGO_HSTS_SECONDS: "31536000"
          TRUST_X_FORWARDED_PROTO: "true"
          NUM_PROXIES: "1"
          # `check --tag security` não abre conexão: basta a URL existir para não cair no SQLite.
          DATABASE_URL: postgresql://biahflow:x@db:5432/biahflow
          REDIS_URL: redis://redis:6379/0
        run: |
          uv run python manage.py collectstatic --noinput
          DJANGO_SECRET_KEY="$(openssl rand -base64 48)" \
            uv run python manage.py check --deploy --fail-level WARNING --tag security

  # A busca vetorial tem dois caminhos (FDD 029, ADR 0022): `CosineDistance` no Postgres e cosseno
  # em Python no SQLite, porque a suíte roda em SQLite e a produção em Postgres. Este job existe
  # para o caminho **de produção** ser exercitado de verdade — sem ele, o único que os testes
  # cobrem seria justamente o que nunca roda no ar. O teste de paridade compara os dois.
  backend-pgvector:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: biahflow
          POSTGRES_USER: biahflow
          POSTGRES_PASSWORD: ci
        options: >-
          --health-cmd "pg_isready -U biahflow" --health-interval 5s
          --health-timeout 5s --health-retries 10
        ports: ["5432:5432"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync
      # `--no-cov` de propósito: aqui roda um punhado de testes, e o gate de 90% é do job `backend`,
      # que mede a suíte inteira. Cobrar cobertura nos dois faria este reprovar sempre.
      - run: uv run pytest -m pgvector --no-cov
        env:
          DATABASE_URL: postgresql://biahflow:ci@localhost:5432/biahflow

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e
