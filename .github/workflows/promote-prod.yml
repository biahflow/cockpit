# Promove para produção exatamente os manifests já validados em HML.
# Este workflow não contém e não pode ganhar uma etapa de build da aplicação.
name: promote-prod

on:
  push:
    tags:
      - "v*"

concurrency:
  group: promote-prod-biahflow
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

jobs:
  prepara:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      source_sha: ${{ steps.release.outputs.source_sha }}
      hml_run_id: ${{ steps.release.outputs.hml_run_id }}
      hml_run_attempt: ${{ steps.release.outputs.hml_run_attempt }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Valida a decisão de release e a ancestralidade
        id: tag
        env:
          REF_PROTECTED: ${{ github.ref_protected }}
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_TYPE" = "tag" ]] \
            || { echo "::error::a promoção exige uma tag"; exit 1; }
          [[ "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]] \
            || { echo "::error::$GITHUB_REF_NAME não é uma tag SemVer estável vX.Y.Z"; exit 1; }
          [ "$REF_PROTECTED" = "true" ] \
            || { echo "::error::$GITHUB_REF_NAME não está coberta por branch protection/ruleset"; exit 1; }

          source_sha=$(git rev-parse "$GITHUB_REF^{commit}")
          git fetch origin main --quiet
          git merge-base --is-ancestor "$source_sha" FETCH_HEAD \
            || { echo "::error::$source_sha não é alcançável pela main protegida"; exit 1; }
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"

      - name: Recupera uma única evidência HML válida
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ steps.tag.outputs.source_sha }}
        run: |
          set -euo pipefail
          runs=$(gh api --method GET \
            "/repos/$GITHUB_REPOSITORY/actions/workflows/deploy-hml.yml/runs" \
            -f event=push -f head_sha="$SOURCE_SHA" -f per_page=100)

          matching_runs=$(jq --arg sha "$SOURCE_SHA" \
            '[.workflow_runs[] | select(.head_sha == $sha and .event == "push")]' <<<"$runs")
          [ "$(jq 'length' <<<"$matching_runs")" -eq 1 ] \
            || { echo "::error::evidência HML ausente ou ambígua para $SOURCE_SHA"; exit 1; }

          run=$(jq '.[0]' <<<"$matching_runs")
          [ "$(jq -r '.status' <<<"$run")" = "completed" ] \
            && [ "$(jq -r '.conclusion' <<<"$run")" = "success" ] \
            || { echo "::error::o run HML de $SOURCE_SHA não terminou com sucesso"; exit 1; }
          run_id=$(jq -er '.id' <<<"$run")
          run_attempt=$(jq -er '.run_attempt' <<<"$run")
          artifact_name="hml-release-$SOURCE_SHA-$run_id-$run_attempt"

          artifacts=$(gh api --method GET \
            "/repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts" -f per_page=100)
          matches=$(jq --arg name "$artifact_name" \
            '[.artifacts[] | select(.name == $name)]' <<<"$artifacts")
          [ "$(jq 'length' <<<"$matches")" -eq 1 ] \
            || { echo "::error::artifact $artifact_name ausente ou duplicado"; exit 1; }

          artifact=$(jq '.[0]' <<<"$matches")
          [ "$(jq -r '.expired' <<<"$artifact")" = "false" ] \
            || { echo "::error::artifact $artifact_name expirou"; exit 1; }
          artifact_id=$(jq -er '.id' <<<"$artifact")
          expected_archive_digest=$(jq -er \
            '.digest | select(test("^sha256:[0-9a-f]{64}$"))' <<<"$artifact")

          gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" > hml-evidence.zip
          actual_archive_digest="sha256:$(sha256sum hml-evidence.zip | cut -d' ' -f1)"
          [ "$actual_archive_digest" = "$expected_archive_digest" ] \
            || { echo "::error::checksum do artifact HML não confere"; exit 1; }

          mkdir validated-hml
          unzip -q hml-evidence.zip -d validated-hml
          [ -f validated-hml/hml-release-evidence.json ] \
            || { echo "::error::artifact não contém hml-release-evidence.json"; exit 1; }
          python3 .github/scripts/release_evidence.py validate-hml \
            --file validated-hml/hml-release-evidence.json \
            --source-sha "$SOURCE_SHA" \
            --repository "$GITHUB_REPOSITORY" \
            --run-id "$run_id" \
            --run-attempt "$run_attempt"

          cp validated-hml/hml-release-evidence.json hml-release-evidence.json
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "hml_run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "hml_run_attempt=$run_attempt" >> "$GITHUB_OUTPUT"

      - name: Transfere a entrada validada para o job protegido
        uses: actions/upload-artifact@v4
        with:
          name: promotion-input-${{ github.run_id }}
          path: hml-release-evidence.json
          if-no-files-found: error
          compression-level: 0

  promove:
    needs: prepara
    runs-on: ubuntu-latest
    timeout-minutes: 35
    environment: production
    permissions:
      actions: read
      contents: read
      id-token: write
    env:
      RELEASE_TAG: ${{ github.ref_name }}
      SOURCE_SHA: ${{ needs.prepara.outputs.source_sha }}
      PROD_GCP_PROJECT_ID: ${{ vars.PROD_GCP_PROJECT_ID }}
      PROD_GCP_REGION: ${{ vars.PROD_GCP_REGION }}
      PROD_GCP_REGISTRY: ${{ vars.PROD_GCP_REGISTRY }}
      PROD_GCP_WIF_PROVIDER: ${{ vars.PROD_GCP_WIF_PROVIDER }}
      PROD_GCP_SERVICE_ACCOUNT: ${{ vars.PROD_GCP_SERVICE_ACCOUNT }}
      PROD_API_SERVICE: ${{ vars.PROD_API_SERVICE }}
      PROD_WEB_SERVICE: ${{ vars.PROD_WEB_SERVICE }}
      PROD_MIGRATION_JOB: ${{ vars.PROD_MIGRATION_JOB }}
      PROD_SCHEDULER_WORKER_POOL: ${{ vars.PROD_SCHEDULER_WORKER_POOL }}
      PROD_INTEGRATION_CHECK_JOB: ${{ vars.PROD_INTEGRATION_CHECK_JOB }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/download-artifact@v4
        with:
          name: promotion-input-${{ github.run_id }}

      - name: Valida o contrato de configuração PROD
        run: |
          set -euo pipefail
          required=(
            PROD_GCP_PROJECT_ID PROD_GCP_REGION PROD_GCP_REGISTRY PROD_GCP_WIF_PROVIDER
            PROD_GCP_SERVICE_ACCOUNT PROD_API_SERVICE PROD_WEB_SERVICE PROD_MIGRATION_JOB
            PROD_SCHEDULER_WORKER_POOL
            PROD_INTEGRATION_CHECK_JOB
          )
          missing=()
          for name in "${required[@]}"; do
            [ -n "${!name:-}" ] || missing+=("$name")
          done
          [ "${#missing[@]}" -eq 0 ] \
            || { echo "::error::GitHub Environment production sem: ${missing[*]}"; exit 1; }
          [[ "$PROD_GCP_PROJECT_ID" =~ ^[a-z][a-z0-9-]{4,28}[a-z0-9]$ ]] \
            || { echo "::error::PROD_GCP_PROJECT_ID não é um project ID válido"; exit 1; }
          [[ "$PROD_GCP_REGION" =~ ^[a-z]+(-[a-z]+)+[0-9]+$ ]] \
            || { echo "::error::PROD_GCP_REGION não é uma região válida"; exit 1; }
          [[ "$PROD_GCP_REGISTRY" =~ ^$PROD_GCP_REGION-docker\.pkg\.dev/$PROD_GCP_PROJECT_ID/[a-z][a-z0-9._-]*$ ]] \
            || { echo "::error::PROD_GCP_REGISTRY não corresponde ao projeto e à região"; exit 1; }
          [[ "$PROD_GCP_WIF_PROVIDER" =~ ^projects/[0-9]+/locations/global/workloadIdentityPools/[a-z0-9-]+/providers/[a-z0-9-]+$ ]] \
            || { echo "::error::PROD_GCP_WIF_PROVIDER não é um provider WIF válido"; exit 1; }
          [[ "$PROD_GCP_SERVICE_ACCOUNT" =~ ^[a-z][a-z0-9-]{4,28}[a-z0-9]@[a-z][a-z0-9-]{4,28}[a-z0-9]\.iam\.gserviceaccount\.com$ ]] \
            || { echo "::error::PROD_GCP_SERVICE_ACCOUNT não é uma service account válida"; exit 1; }
          for name in PROD_API_SERVICE PROD_WEB_SERVICE PROD_MIGRATION_JOB \
            PROD_SCHEDULER_WORKER_POOL PROD_INTEGRATION_CHECK_JOB; do
            [[ "${!name}" =~ ^[a-z]([-a-z0-9]{0,61}[a-z0-9])?$ ]] \
              || { echo "::error::$name não é um identificador Cloud Run válido"; exit 1; }
          done
          python3 .github/scripts/release_evidence.py validate-hml \
            --file hml-release-evidence.json \
            --source-sha "$SOURCE_SHA" \
            --repository "$GITHUB_REPOSITORY" \
            --run-id "${{ needs.prepara.outputs.hml_run_id }}" \
            --run-attempt "${{ needs.prepara.outputs.hml_run_attempt }}"

      - uses: google-github-actions/auth@v2
        with:
          project_id: ${{ vars.PROD_GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.PROD_GCP_WIF_PROVIDER }}
          service_account: ${{ vars.PROD_GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2
        with:
          install_components: beta

      - uses: docker/setup-buildx-action@v3

      - name: Autoriza origem e destino
        run: |
          set -euo pipefail
          source_repository=$(jq -er '.images.backend.source_repository' hml-release-evidence.json)
          source_host=${source_repository%%/*}
          prod_host=${PROD_GCP_REGISTRY%%/*}
          hosts=$source_host
          [ "$source_host" = "$prod_host" ] || hosts="$source_host,$prod_host"
          gcloud auth configure-docker "$hosts" --quiet

      - name: Promove os manifests sem rebuild
        run: |
          set -euo pipefail

          digest_of() {
            docker buildx imagetools inspect "$1" --format '{{json .Manifest}}' \
              | jq -er '.digest | select(test("^sha256:[0-9a-f]{64}$"))'
          }

          assert_revision() {
            local reference="$1"
            docker buildx imagetools inspect "$reference" --format '{{json .Image}}' \
              | jq -e --arg sha "$SOURCE_SHA" \
                  '.config.Labels["org.opencontainers.image.revision"] == $sha' >/dev/null \
              || { echo "::error::$reference não pertence ao source SHA $SOURCE_SHA"; return 1; }
          }

          promove() {
            local key="$1" logical_name="$2"
            local source_repository digest target_repository resolved
            source_repository=$(jq -er ".images.$key.source_repository" hml-release-evidence.json)
            digest=$(jq -er ".images.$key.digest" hml-release-evidence.json)
            target_repository="$PROD_GCP_REGISTRY/$logical_name"

            assert_revision "$source_repository@$digest"
            docker buildx imagetools create --prefer-index=false \
              --tag "$target_repository:$RELEASE_TAG" \
              "$source_repository@$digest"
            resolved=$(digest_of "$target_repository:$RELEASE_TAG")
            [ "$resolved" = "$digest" ] \
              || { echo "::error::$logical_name mudou de digest durante a promoção"; return 1; }
            assert_revision "$target_repository@$digest"
            echo "${key^^}_PROD_REPOSITORY=$target_repository" >> "$GITHUB_ENV"
            echo "${key^^}_PROD_DIGEST=$digest" >> "$GITHUB_ENV"
            echo "${key^^}_PROD_REF=$target_repository@$digest" >> "$GITHUB_ENV"
          }

          promove backend pulse-api
          promove frontend pulse-web

      - name: Migra o banco
        run: |
          set -euo pipefail
          gcloud run jobs update "$PROD_MIGRATION_JOB" \
            --project "$PROD_GCP_PROJECT_ID" --region "$PROD_GCP_REGION" \
            --image "$BACKEND_PROD_REF" --quiet
          gcloud run jobs execute "$PROD_MIGRATION_JOB" \
            --project "$PROD_GCP_PROJECT_ID" --region "$PROD_GCP_REGION" --wait

      - name: Publica as revisões por digest
        run: |
          set -euo pipefail
          gcloud run services update "$PROD_API_SERVICE" \
            --project "$PROD_GCP_PROJECT_ID" --region "$PROD_GCP_REGION" \
            --image "$BACKEND_PROD_REF" --quiet
          gcloud run services update "$PROD_WEB_SERVICE" \
            --project "$PROD_GCP_PROJECT_ID" --region "$PROD_GCP_REGION" \
            --image "$FRONTEND_PROD_REF" --quiet

      - name: Atualiza o agendador por digest
        run: |
          set -euo pipefail
          gcloud beta run worker-pools update "$PROD_SCHEDULER_WORKER_POOL" \
            --project "$PROD_GCP_PROJECT_ID" --region "$PROD_GCP_REGION" \
            --image "$BACKEND_PROD_REF" --quiet

      - name: Sonda as integrações
        continue-on-error: true
        run: |
          set -euo pipefail
          gcloud run jobs update "$PROD_INTEGRATION_CHECK_JOB" \
            --project "$PROD_GCP_PROJECT_ID" --region "$PROD_GCP_REGION" \
            --image "$BACKEND_PROD_REF" --quiet
          gcloud run jobs execute "$PROD_INTEGRATION_CHECK_JOB" \
            --project "$PROD_GCP_PROJECT_ID" --region "$PROD_GCP_REGION" --wait

      - name: Fumaça
        run: |
          set -euo pipefail
          url=$(gcloud run services describe "$PROD_WEB_SERVICE" \
            --project "$PROD_GCP_PROJECT_ID" --region "$PROD_GCP_REGION" \
            --format='value(status.url)')
          for tentativa in 1 2 3 4 5; do
            if curl -sf --max-time 10 "$url/" >/dev/null; then
              echo "$PROD_WEB_SERVICE responde em $url"
              exit 0
            fi
            echo "tentativa $tentativa falhou; esperando"
            sleep 10
          done
          echo "::error::produção não respondeu depois do deploy"
          exit 1

      - name: Confere os digests efetivamente implantados
        run: |
          set -euo pipefail

          service_ref() {
            local service="$1" revision
            revision=$(gcloud run services describe "$service" \
              --project "$PROD_GCP_PROJECT_ID" --region "$PROD_GCP_REGION" \
              --format='value(status.latestReadyRevisionName)')
            [ -n "$revision" ] || { echo "::error::$service não tem revisão pronta"; return 1; }
            gcloud run revisions describe "$revision" \
              --project "$PROD_GCP_PROJECT_ID" --region "$PROD_GCP_REGION" \
              --format='value(spec.containers[0].image)'
          }

          assert_ref() {
            local resource="$1" expected="$2" actual="$3"
            [ "$actual" = "$expected" ] \
              || { echo "::error::$resource usa $actual; esperado $expected"; return 1; }
          }

          api_runtime_ref=$(service_ref "$PROD_API_SERVICE")
          web_runtime_ref=$(service_ref "$PROD_WEB_SERVICE")
          migrate_ref=$(gcloud run jobs describe "$PROD_MIGRATION_JOB" \
            --project "$PROD_GCP_PROJECT_ID" --region "$PROD_GCP_REGION" --format=json \
            | jq -er '.template.template.containers[0].image
              // .spec.template.spec.template.spec.containers[0].image
              // .spec.template.template.containers[0].image')
          scheduler_ref=$(gcloud beta run worker-pools describe "$PROD_SCHEDULER_WORKER_POOL" \
            --project "$PROD_GCP_PROJECT_ID" --region "$PROD_GCP_REGION" --format=json \
            | jq -er '.template.containers[0].image
              // .spec.template.spec.containers[0].image
              // .spec.template.containers[0].image')

          assert_ref "$PROD_API_SERVICE" "$BACKEND_PROD_REF" "$api_runtime_ref"
          assert_ref "$PROD_WEB_SERVICE" "$FRONTEND_PROD_REF" "$web_runtime_ref"
          assert_ref "$PROD_MIGRATION_JOB" "$BACKEND_PROD_REF" "$migrate_ref"
          assert_ref "$PROD_SCHEDULER_WORKER_POOL" "$BACKEND_PROD_REF" "$scheduler_ref"
          echo "PROD_API_RUNTIME_REF=$api_runtime_ref" >> "$GITHUB_ENV"
          echo "PROD_WEB_RUNTIME_REF=$web_runtime_ref" >> "$GITHUB_ENV"

      - name: Serializa e valida a evidência PROD
        run: |
          set -euo pipefail
          python3 .github/scripts/release_evidence.py write-production \
            --output production-release-evidence.json \
            --hml-file hml-release-evidence.json \
            --release-tag "$RELEASE_TAG" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --backend-repository "$BACKEND_PROD_REPOSITORY" \
            --backend-digest "$BACKEND_PROD_DIGEST" \
            --backend-runtime-ref "$PROD_API_RUNTIME_REF" \
            --frontend-repository "$FRONTEND_PROD_REPOSITORY" \
            --frontend-digest "$FRONTEND_PROD_DIGEST" \
            --frontend-runtime-ref "$PROD_WEB_RUNTIME_REF"
          python3 .github/scripts/release_evidence.py validate-production \
            --file production-release-evidence.json

      - name: Persiste a evidência de produção
        id: evidence_artifact
        uses: actions/upload-artifact@v4
        with:
          name: production-release-${{ github.ref_name }}-${{ needs.prepara.outputs.source_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: production-release-evidence.json
          if-no-files-found: error
          compression-level: 0

      - name: Resume a promoção
        run: |
          {
            echo "## Produção promovida sem rebuild"
            echo
            echo "- Release: \`$RELEASE_TAG\` → \`$SOURCE_SHA\`"
            echo "- HML run: ${{ needs.prepara.outputs.hml_run_id }}"
            echo "- Backend HML = PROD: \`$BACKEND_PROD_DIGEST\`"
            echo "- Frontend HML = PROD: \`$FRONTEND_PROD_DIGEST\`"
            echo "- Evidence artifact: ${{ steps.evidence_artifact.outputs.artifact-url }}"
          } >> "$GITHUB_STEP_SUMMARY"
