# Deploy de HML do Pulse.
#
# O deploy de aplicação não roda `terraform apply`. Este workflow só constrói as duas imagens da
# aplicação uma vez, fixa seus digests e projeta a `main` em HML. Infraestrutura, rede, registros,
# segredos e identidades são de outro repositório — e QUAL repositório é a parte que precisa estar
# escrita, porque a resposta é contraintuitiva (ADR 0044,
# `docs/adr/0044-a-infra-do-pulse-mora-no-outro-repositorio.md`):
#
# 1. NÃO é `biahflow/infra`, apesar do nome e da descrição dele. Os cinco recursos `cockpit-*`
#    que este workflow atualiza são declarados em `biahflow/portal-cliente`, em
#    `infra/terraform/ambientes/hml-biahflow/servicos.tf`, sobre a fundação de HML que fica ao
#    lado, em `ambientes/hml`. Lá é onde se muda escala, ingress, rede, variável e segredo; aqui
#    só se troca a imagem por digest. `apply` é `workflow_dispatch` com flag, e é Human Gate.
# 2. `cockpit-*` é PREFIXO HISTÓRICO do Pulse — os recursos herdaram o nome do repositório, que a
#    ADR 0030 rebatizou de `portal` para `cockpit` antes de a ADR 0035 nomear o produto de Pulse.
#    O rename para `pulse-*` está decidido e sai por PR daquele repositório, tocando os dois
#    stacks no mesmo lote: a chave do serviço em `servicos.tf` e o literal `origem_do_crm` em
#    `ambientes/hml/cloudflare.tf`, que é de outro state e já quebrou uma vez neste movimento.
#    Produção, que ainda não existe, nasce `pulse-*`: os nomes de lá saem de `vars.PROD_*`.
name: deploy-hml

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:

concurrency:
  group: deploy-hml-biahflow
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write
  packages: write

env:
  PROJETO: biahflow-hml
  REGIAO: us-east1
  REGISTRO: us-east1-docker.pkg.dev/biahflow-hml/hml

jobs:
  # A fila não pode cancelar uma migração em curso, mas um SHA superado também não deve publicar
  # uma revisão que já nasceu velha. Só a ponta atual da main segue para o build.
  guarda:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      seguir: ${{ steps.ponta.outputs.seguir }}
    steps:
      - uses: actions/checkout@v4
      - id: ponta
        run: |
          set -euo pipefail
          git fetch origin main --quiet
          topo=$(git rev-parse FETCH_HEAD)
          if [ "$topo" = "$GITHUB_SHA" ]; then
            echo "seguir=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::$GITHUB_SHA foi superado por $topo; quem publica é o run dele."
            echo "seguir=false" >> "$GITHUB_OUTPUT"
          fi

  deploy:
    needs: guarda
    if: needs.guarda.outputs.seguir == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          project_id: biahflow-hml
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: hml-deploy@biahflow-hml.iam.gserviceaccount.com

      - uses: google-github-actions/setup-gcloud@v2
        with:
          install_components: beta

      - uses: docker/setup-buildx-action@v3

      - name: Autoriza os dois registros
        run: |
          set -euo pipefail
          gcloud auth configure-docker "$REGIAO-docker.pkg.dev" --quiet
          echo "${{ github.token }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Constrói uma vez, publica e resolve os digests
        run: |
          set -euo pipefail

          digest_of() {
            docker buildx imagetools inspect "$1" --format '{{json .Manifest}}' \
              | jq -er '.digest | select(test("^sha256:[0-9a-f]{64}$"))'
          }

          assert_revision() {
            local reference="$1"
            docker buildx imagetools inspect "$reference" --format '{{json .Image}}' \
              | jq -e --arg sha "$GITHUB_SHA" \
                  '.config.Labels["org.opencontainers.image.revision"] == $sha' >/dev/null \
              || { echo "::error::$reference não declara revision=$GITHUB_SHA"; return 1; }
          }

          publica() {
            local nome="$1" contexto="$2"
            local gcp_repository="$REGISTRO/$nome"
            local ghcr_repository="ghcr.io/${{ github.repository }}/$nome"
            local gcp_ref="$gcp_repository:$GITHUB_SHA"
            local ghcr_ref="$ghcr_repository:$GITHUB_SHA"
            local gcp_digest="" ghcr_digest=""

            gcp_digest=$(digest_of "$gcp_ref" 2>/dev/null || true)
            ghcr_digest=$(digest_of "$ghcr_ref" 2>/dev/null || true)

            if [ -z "$gcp_digest" ] && [ -z "$ghcr_digest" ]; then
              docker build \
                --label "org.opencontainers.image.revision=$GITHUB_SHA" \
                --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
                -t "$gcp_ref" "$contexto"
              docker push "$gcp_ref"
            elif [ -z "$gcp_digest" ] && [ -n "$ghcr_digest" ]; then
              assert_revision "$ghcr_repository@$ghcr_digest"
              docker buildx imagetools create --prefer-index=false \
                --tag "$gcp_ref" "$ghcr_repository@$ghcr_digest"
            fi

            gcp_digest=$(digest_of "$gcp_ref")
            assert_revision "$gcp_repository@$gcp_digest"
            if [ "$ghcr_digest" != "$gcp_digest" ]; then
              echo "$nome: sincronizando o manifest canônico no espelho GHCR."
              docker buildx imagetools create --prefer-index=false \
                --tag "$ghcr_ref" "$gcp_repository@$gcp_digest"
            else
              echo "$nome já existe nos dois registros; reutilizando o artefato imutável."
            fi

            ghcr_digest=$(digest_of "$ghcr_ref")
            [ "$gcp_digest" = "$ghcr_digest" ] \
              || { echo "::error::$nome divergiu entre registros: $gcp_digest != $ghcr_digest"; return 1; }
            assert_revision "$ghcr_repository@$ghcr_digest"
          }

          publica cockpit-api backend
          publica cockpit-web frontend

          api_digest=$(digest_of "$REGISTRO/cockpit-api:$GITHUB_SHA")
          web_digest=$(digest_of "$REGISTRO/cockpit-web:$GITHUB_SHA")
          echo "API_DIGEST=$api_digest" >> "$GITHUB_ENV"
          echo "WEB_DIGEST=$web_digest" >> "$GITHUB_ENV"
          echo "API_REF=$REGISTRO/cockpit-api@$api_digest" >> "$GITHUB_ENV"
          echo "WEB_REF=$REGISTRO/cockpit-web@$web_digest" >> "$GITHUB_ENV"

      # A imagem recusa subir com configuração insegura. Migração continua sendo o primeiro uso do
      # backend novo e bloqueia o deploy quando falha.
      - name: Migra o banco
        run: |
          set -euo pipefail
          gcloud run jobs update cockpit-migrate \
            --image "$API_REF" --region "$REGIAO" --quiet
          gcloud run jobs execute cockpit-migrate --region "$REGIAO" --wait

      - name: Publica as revisões por digest
        run: |
          set -euo pipefail
          gcloud run services update cockpit-api \
            --image "$API_REF" --region "$REGIAO" --quiet
          gcloud run services update cockpit-web \
            --image "$WEB_REF" --region "$REGIAO" --quiet

      - name: Atualiza o agendador por digest
        run: |
          set -euo pipefail
          gcloud beta run worker-pools update cockpit-scheduler \
            --image "$API_REF" --region "$REGIAO" --quiet

      # A sonda continua não bloqueante: indisponibilidade de um fornecedor não reverte código bom,
      # mas o step fica amarelo e registra a falha em vez de escondê-la com `|| true`.
      - name: Sonda as integrações
        continue-on-error: true
        run: |
          set -euo pipefail
          gcloud run jobs update cockpit-check \
            --image "$API_REF" --region "$REGIAO" --quiet
          gcloud run jobs execute cockpit-check --region "$REGIAO" --wait

      - name: Fumaça
        run: |
          set -euo pipefail
          url=$(gcloud run services describe cockpit-web --region "$REGIAO" --format='value(status.url)')
          for tentativa in 1 2 3 4 5; do
            if curl -sf --max-time 10 "$url/" >/dev/null; then
              echo "cockpit-web responde em $url"
              exit 0
            fi
            echo "tentativa $tentativa falhou; esperando"
            sleep 10
          done
          echo "::error::o Pulse não respondeu depois do deploy"
          exit 1

      - name: Confere os digests efetivamente implantados
        run: |
          set -euo pipefail

          service_ref() {
            local service="$1" revision
            revision=$(gcloud run services describe "$service" --region "$REGIAO" \
              --format='value(status.latestReadyRevisionName)')
            [ -n "$revision" ] || { echo "::error::$service não tem revisão pronta"; return 1; }
            gcloud run revisions describe "$revision" --region "$REGIAO" \
              --format='value(spec.containers[0].image)'
          }

          assert_ref() {
            local resource="$1" expected="$2" actual="$3"
            [ "$actual" = "$expected" ] \
              || { echo "::error::$resource usa $actual; esperado $expected"; return 1; }
          }

          api_runtime_ref=$(service_ref cockpit-api)
          web_runtime_ref=$(service_ref cockpit-web)
          migrate_ref=$(gcloud run jobs describe cockpit-migrate --region "$REGIAO" --format=json \
            | jq -er '.template.template.containers[0].image
              // .spec.template.spec.template.spec.containers[0].image
              // .spec.template.template.containers[0].image')
          scheduler_ref=$(gcloud beta run worker-pools describe cockpit-scheduler \
            --region "$REGIAO" --format=json \
            | jq -er '.template.containers[0].image
              // .spec.template.spec.containers[0].image
              // .spec.template.containers[0].image')

          assert_ref cockpit-api "$API_REF" "$api_runtime_ref"
          assert_ref cockpit-web "$WEB_REF" "$web_runtime_ref"
          assert_ref cockpit-migrate "$API_REF" "$migrate_ref"
          assert_ref cockpit-scheduler "$API_REF" "$scheduler_ref"

          echo "HML_API_RUNTIME_REF=$api_runtime_ref" >> "$GITHUB_ENV"
          echo "HML_WEB_RUNTIME_REF=$web_runtime_ref" >> "$GITHUB_ENV"

      - name: Serializa a evidência HML
        run: |
          set -euo pipefail
          python3 .github/scripts/release_evidence.py write-hml \
            --output hml-release-evidence.json \
            --source-sha "$GITHUB_SHA" \
            --repository "$GITHUB_REPOSITORY" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT" \
            --backend-repository "$REGISTRO/cockpit-api" \
            --backend-digest "$API_DIGEST" \
            --backend-runtime-ref "$HML_API_RUNTIME_REF" \
            --backend-mirror-repository "ghcr.io/$GITHUB_REPOSITORY/cockpit-api" \
            --backend-mirror-digest "$API_DIGEST" \
            --frontend-repository "$REGISTRO/cockpit-web" \
            --frontend-digest "$WEB_DIGEST" \
            --frontend-runtime-ref "$HML_WEB_RUNTIME_REF" \
            --frontend-mirror-repository "ghcr.io/$GITHUB_REPOSITORY/cockpit-web" \
            --frontend-mirror-digest "$WEB_DIGEST"
          python3 .github/scripts/release_evidence.py validate-hml \
            --file hml-release-evidence.json \
            --source-sha "$GITHUB_SHA" \
            --repository "$GITHUB_REPOSITORY" \
            --run-id "$GITHUB_RUN_ID" \
            --run-attempt "$GITHUB_RUN_ATTEMPT"

      - name: Persiste a evidência imutável
        id: evidence_artifact
        uses: actions/upload-artifact@v4
        with:
          name: hml-release-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: hml-release-evidence.json
          if-no-files-found: error
          compression-level: 0

      - name: Resume a homologação
        run: |
          {
            echo "## HML validado por digest"
            echo
            echo "- Source SHA: \`$GITHUB_SHA\`"
            echo "- Backend: \`$API_DIGEST\`"
            echo "- Frontend: \`$WEB_DIGEST\`"
            echo "- Artifact digest: \`${{ steps.evidence_artifact.outputs.artifact-digest }}\`"
            echo "- Artifact: ${{ steps.evidence_artifact.outputs.artifact-url }}"
          } >> "$GITHUB_STEP_SUMMARY"
