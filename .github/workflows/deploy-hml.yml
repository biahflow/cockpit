# Deploy de HML do Biahflow.
#
# Mesmo desenho do portal do cliente, e a mesma separação: **deploy de aplicação
# não roda `terraform apply`**. O Terraform dos dois portais mora num lugar só
# (`biahflow-portal-cliente/infra/terraform`), porque a rede, o registro, os
# segredos e a identidade são compartilhados — dois estados sobre os mesmos
# recursos é como se cria drift que ninguém consegue explicar.
name: deploy-hml

on:
  push:
    branches: [main]
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  workflow_dispatch:

concurrency:
  group: deploy-hml-biahflow
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write
  packages: write

env:
  PROJETO: biahflow-hml
  REGIAO: us-east1
  REGISTRO: us-east1-docker.pkg.dev/biahflow-hml/hml

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          project_id: biahflow-hml
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: hml-deploy@biahflow-hml.iam.gserviceaccount.com

      # `beta` é declarado aqui e não instalado no passo que o usa: o worker pool do
      # agendador só existe em `gcloud beta`, e o runner não traz esse componente. Sem
      # esta linha o comando **pergunta** se pode instalá-lo — antes de olhar as flags,
      # de modo que o `--quiet` que ele já tem não é lido —, e num shell não interativo
      # isso é `exit 1` com uma mensagem que manda usar a flag que já está lá.
      - uses: google-github-actions/setup-gcloud@v2
        with:
          install_components: beta

      - name: Autoriza os dois registros
        run: |
          gcloud auth configure-docker "$REGIAO-docker.pkg.dev" --quiet
          echo "${{ github.token }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Constrói e publica
        run: |
          set -euo pipefail
          publica() {
            local nome="$1" contexto="$2"
            docker build -t "$REGISTRO/$nome:$GITHUB_SHA" \
                         -t "ghcr.io/${{ github.repository }}/$nome:$GITHUB_SHA" "$contexto"
            docker push "$REGISTRO/$nome:$GITHUB_SHA"
            docker push "ghcr.io/${{ github.repository }}/$nome:$GITHUB_SHA"
          }
          publica cockpit-api backend
          publica cockpit-web frontend

      # A imagem recusa subir com configuração insegura: o entrypoint roda
      # `check --deploy --fail-level WARNING --tag security` antes do gunicorn
      # (ADR 0011). Se um segredo faltar, o deploy morre aqui — e é onde deve.
      - name: Migra o banco
        run: |
          gcloud run jobs update cockpit-migrate \
            --image "$REGISTRO/cockpit-api:$GITHUB_SHA" \
            --region "$REGIAO" --quiet
          gcloud run jobs execute cockpit-migrate --region "$REGIAO" --wait

      - name: Publica as revisões
        run: |
          for s in cockpit-api cockpit-web; do
            gcloud run services update "$s" \
              --image "$REGISTRO/$s:$GITHUB_SHA" \
              --region "$REGIAO" --quiet
          done

      # O agendador (FDD 023: digest diário, sincronia de calendário, alerta de
      # backup velho) é um **worker pool**: Cloud Run sem HTTP. A imagem é a da
      # `cockpit-api`, porque ele roda `manage.py` do mesmo código.
      #
      # Ele existia no `docker-compose.prod.yml` e não tinha casa em HML, o que
      # significa que as três rotinas não rodariam — incluindo a que avisa que o
      # backup envelheceu. Um alerta de backup que não roda é pior que nenhum: faz
      # o silêncio parecer boa notícia.
      - name: Atualiza o agendador
        run: |
          gcloud beta run worker-pools update cockpit-scheduler \
            --image "$REGISTRO/cockpit-api:$GITHUB_SHA" \
            --region "$REGIAO" --quiet

      # A sonda pergunta ao **provedor**, não ao ambiente — é a tese da FDD 024
      # aplicada ao deploy: "a variável está definida" não é a mesma pergunta que
      # "a credencial funciona". Não falha o deploy, porque integração fora do ar
      # não é motivo para reverter código que está bom; deixa o veredito no log.
      #
      # O `update` antes do `execute` **faltava**, e a ausência dele não deixava
      # nada vermelho: este passo é `continue-on-error`, então executar um job que
      # ainda estava na `imagem_bootstrap` falhava com `Application exec likely
      # failed` e seguia em frente. O veredito que o comentário acima promete nunca
      # foi escrito em lugar nenhum — a sonda estava desligada desde sempre, e
      # dizendo no log da esteira que tinha rodado.
      - name: Sonda as integrações
        continue-on-error: true
        run: |
          gcloud run jobs update cockpit-check \
            --image "$REGISTRO/cockpit-api:$GITHUB_SHA" \
            --region "$REGIAO" --quiet
          gcloud run jobs execute cockpit-check --region "$REGIAO" --wait || true

      - name: Fumaça
        run: |
          set -euo pipefail
          url=$(gcloud run services describe cockpit-web --region "$REGIAO" --format='value(status.url)')
          for tentativa in 1 2 3 4 5; do
            if curl -sf --max-time 10 "$url/" > /dev/null; then
              echo "cockpit-web responde em $url"; exit 0
            fi
            echo "tentativa $tentativa falhou; esperando"; sleep 10
          done
          echo "::error::o Biahflow não respondeu depois do deploy"; exit 1
